    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.6s ease;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash h1 {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        color: #fff;
        font-size: 2.5rem;
        margin: 0 0 1rem 0;
        text-align: center;
        letter-spacing: 2px;
      }
      #splash p {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        color: #aaa;
        font-size: 1rem;
        margin: 0;
        text-align: center;
      }
      #splash .dots::after {
        content: "";
        animation: dots 1.2s steps(3, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        33% {
          content: ".";
        }
        66% {
          content: "..";
        }
        100% {
          content: "...";
        }
      }
    </style>

      setTimeout(function() { splash.remove(); }, 700);
    }

      var urls = constructNet_scriptURLs;
      var chain = Promise.resolve();
      for (var i = 0; i < urls.length; i++) {
        (function(scriptSrc) {
          chain = chain.then(function () {
            return fetch(scriptSrc)
              .then(function(r) { return r.blob(); })
              .then(function(blob) {
                var blobUrl = URL.createObjectURL(blob);
                return new Promise(function(resolve) {
                  var s = document.createElement("script");
                  s.src = blobUrl;
                  s.async = false;
                  s.onload = function() { URL.revokeObjectURL(blobUrl); resolve(); };
                  s.onerror = function() {
                    URL.revokeObjectURL(blobUrl);
                    var s2 = document.createElement("script");
                    s2.src = scriptSrc;
                    s2.async = false;
                    s2.onload = resolve;
                    s2.onerror = resolve;
                    document.body.appendChild(s2);
                  };
                  document.body.appendChild(s);
                });
              });
          });

        if (constructNet_madeInC2) {
          jQuery(document).ready(function () {
            cr_createRuntime("c2canvas");
          });
          document.addEventListener("visibilitychange", PlayGame.c2onVisibilityChanged, false);

        setTimeout(hideSplash, 2500);

    c2onVisibilityChanged: function () {
      if (document.hidden) cr_setSuspended(true);

            ["input","textarea","datalist","select"].includes(event.target.tagName.toLowerCase())) {
          return;
        }
        if (["ArrowLeft","ArrowUp","ArrowRight","ArrowDown"].includes(event.key)) {
          event.preventDefault();
        }
      });
      document.oncontextmenu = function (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      };
      document.addEventListener("mousewheel", function (e) {
        e.preventDefault();
      }, { passive: false });
    },
  };
